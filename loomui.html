<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Loom UI</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1/build/d3.layout.cloud.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="wordcloud.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e5e7eb;
      --paper: #0b1220;
      --accent: #9ca3af;
      --muted: #94a3b8;
      --border: #1f2937;
      --user-ink: #e5e7eb;
      --model-ink: #c4b5fd;
      --bar: #0f172a;
      --btn-ink: #e5e7eb;
      --btn-bg: #111827;
    }
    * { box-sizing: border-box; }
    html, body {
      touch-action: manipulation;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.4 "Iosevka", "JetBrains Mono", "SFMono-Regular", monospace;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }
    .cluster { display: flex; gap: 8px; align-items: center; }
    .history { gap: 6px; }
    .history input {
      width: 72px;
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--btn-ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border: none;
      font: inherit;
      resize: none;
      background: transparent;
      color: transparent;
      caret-color: var(--ink);
      outline: none;
      field-sizing: content;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    textarea::placeholder { color: var(--muted); }
    textarea::selection { background: rgba(147, 197, 253, 0.3); }
    #padContainer { position: relative; }
    #highlight {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      padding: 14px;
      font: inherit;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    .user-text { color: var(--user-ink); }
    .model-text { color: var(--model-ink); }
    #highlight.jlens { pointer-events: auto; z-index: 2; }
    #highlight.jlens .tok { cursor: crosshair; border-radius: 3px; }
    #highlight.jlens .tok:hover { background: rgba(147, 197, 253, 0.25); }
    #lensTip {
      position: fixed;
      z-index: 30;
      max-width: 720px;
      max-height: 85vh;
      overflow: hidden;
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none; /* never intercept hover; the click panel is the persistent one */
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    #lensTip .lt-cols {
      display: flex;
      gap: 14px;
    }
    #lensTip .lt-cols > div {
      flex: 1 1 0;
      min-width: 0;
    }
    #lensPanel {
      position: fixed;
      top: 8px;
      right: 8px;
      bottom: 8px;
      width: 420px;
      z-index: 29;
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      font-size: 11px;
      line-height: 1.45;
    }
    /* docked, not overlaid: the body padding reserves the panel's column so the
       text reflows clear of it */
    body.lens-panel-open { padding-right: 436px; }
    #lensPanel[hidden] { display: none; } /* the display:flex above beats the hidden attribute otherwise */
    #lensPanelBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #lensPanelClose {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 0 4px;
    }
    #lensPanelClose:hover { color: var(--ink); }
    #lensPanelBody {
      padding: 8px 10px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #lensTip .lt-head { color: var(--muted); margin-bottom: 4px; }
    .lt-gloss { color: var(--muted); font-style: italic; }
    #lensTip .lt-layer { color: var(--muted); }
    #lensTip .lt-err { color: #f87171; }
    #lensTip .lt-val, #lensPanelBody .lt-val { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    #lensTip .lt-val b, #lensPanelBody .lt-val b { font-weight: 600; }
    #lensTip .lt-note, #lensPanelBody .lt-note { color: var(--muted); }
    #lensPanelBody .lt-err { color: #f87171; }
    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--btn-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--btn-bg);
      color: var(--btn-ink);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }
    button:disabled { cursor: not-allowed; opacity: 0.5; box-shadow: none; transform: none; }
    #settingsToggle { font-size: 18px; padding: 10px 14px; }
    #sibPrev, #sibNext, #parentJump, #childJump { font-size: 16px; padding: 10px 14px; }
    .button-link {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      background: var(--btn-bg);
      color: var(--btn-ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .button-link.calendar {
      padding: 10px 14px;
      font-size: 18px;
      line-height: 1.4;
      min-height: 46px;
      height: 46px;
    }
    .icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      line-height: 0;
    }
    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .button-link:active { transform: translateY(1px); }
    .status { color: var(--btn-ink); font-size: 12px; }
    .param { color: var(--btn-ink); display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .param input {
      width: 70px;
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--btn-ink);
      accent-color: var(--btn-ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .param select {
      min-width: 160px;
      background: var(--bar);
      border: 1px solid var(--border);
      color: var(--btn-ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    .param.stop input { width: 200px; }
    .param.prefix input { width: 180px; }
    .param.postfix input { width: 180px; }
    .param.url input { width: 260px; }
    .param input[type="color"] { width: 32px; height: 28px; padding: 2px; cursor: pointer; background: var(--btn-bg); border: 1px solid var(--border); border-radius: 4px; }
    .settings-popout {
      position: fixed;
      top: 52px;
      right: 12px;
      background: var(--bar);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      z-index: 32; /* above the lens panel (29) and hover tooltip (30) */
      min-width: 329px;
      max-width: min(529px, 90vw);
      max-height: calc(100vh - 72px);
      overflow: auto;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--btn-ink);
      font-weight: 600;
    }
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    #wcModal {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center; z-index: 30;
    }
    #wcModal.show { display: flex; }
    #wcPanel {
      background: var(--bar); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; width: 95vw; height: 92vh; display: flex; flex-direction: column; gap: 8px; overflow: auto;
    }
    #wcPanel canvas, #wcCanvas { border-radius: 6px; background: var(--paper); }
    #wcCanvas { flex: 1; min-height: 0; }
    #wcCanvas svg { display: block; width: 100%; height: 100%; }
    #wcClose { align-self: flex-end; background: none; border: none; color: var(--btn-ink); font-size: 1.4rem; cursor: pointer; }
    @media (max-width: 100%) {
      body { font-size: 42px; }
      textarea, input, button, .status, .param { font-size: inherit; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="cluster">
      <button id="generate" class="primary" aria-label="Generate">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M8 17.175V6.825q0-.425.3-.713t.7-.287q.125 0 .263.037t.262.113l8.15 5.175q.225.15.338.375t.112.475t-.112.475t-.338.375l-8.15 5.175q-.125.075-.262.113T9 18.175q-.4 0-.7-.288t-.3-.712"/></svg>
        </span>
      </button>
    </div>

    <div class="cluster">
      <button id="sibPrev" aria-label="Previous sibling">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="m7.85 13l2.85 2.85q.3.3.288.7t-.288.7q-.3.3-.712.313t-.713-.288L4.7 12.7q-.3-.3-.3-.7t.3-.7l4.575-4.575q.3-.3.713-.287t.712.312q.275.3.288.7t-.288.7L7.85 11H19q.425 0 .713.288T20 12t-.288.713T19 13z"/></svg>
        </span>
      </button>
      <button id="parentJump" aria-label="Parent">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="m11 7.825l-4.9 4.9q-.3.3-.7.288t-.7-.313q-.275-.3-.288-.7t.288-.7l6.6-6.6q.15-.15.325-.212T12 4.425t.375.063t.325.212l6.6 6.6q.275.275.275.688t-.275.712q-.3.3-.712.3t-.713-.3L13 7.825V19q0 .425-.288.713T12 20t-.712-.288T11 19z"/></svg>
        </span>
      </button>
      <button id="childJump" aria-label="First child">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M11 16.175V5q0-.425.288-.712T12 4t.713.288T13 5v11.175l4.9-4.9q.3-.3.7-.288t.7.313q.275.3.287.7t-.287.7l-6.6 6.6q-.15.15-.325.213t-.375.062t-.375-.062t-.325-.213l-6.6-6.6q-.275-.275-.275-.687T4.7 11.3q.3-.3.713-.3t.712.3z"/></svg>
        </span>
      </button>
      <button id="sibNext" aria-label="Next sibling">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M16.15 13H5q-.425 0-.712-.288T4 12t.288-.712T5 11h11.15L13.3 8.15q-.3-.3-.288-.7t.288-.7q.3-.3.713-.312t.712.287L19.3 11.3q.15.15.213.325t.062.375t-.062.375t-.213.325l-4.575 4.575q-.3.3-.712.288t-.713-.313q-.275-.3-.288-.7t.288-.7z"/></svg>
        </span>
      </button>
      <button id="rollout" aria-label="Rollout">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 12h4m0 0l10-6m-10 6h10m-10 0l10 6"/></svg>
        </span>
      </button>
      <span id="siblingCount" class="status"></span>
    </div>
    <div class="cluster history">
      <button id="prev" style="display:none;" disabled aria-label="Previous entry">Prev</button>
      <input id="histIndex" style="display:none;" type="number" min="0" step="1" aria-label="History index">
      <span id="historyStatus" style="display:none;" class="status">0/0</span>
      <button id="next" style="display:none;" disabled aria-label="Next entry">Next</button>
    </div>
    <div class="cluster">
      <label class="param">
        <select id="childSelect" aria-label="Children of current entry" style="display:none;">
          <option value="">no children</option>
        </select>
      </label>
    </div>
    <div class="cluster">
      <a id="calendarLink" class="button-link calendar" href="/calendar" target="_blank" rel="noopener noreferrer" aria-label="Calendar" title="Open calendar">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M7 1.75a.75.75 0 0 1 .75.75v.763c.662-.013 1.391-.013 2.194-.013h4.112c.803 0 1.532 0 2.194.013V2.5a.75.75 0 0 1 1.5 0v.827q.39.03.739.076c1.172.158 2.121.49 2.87 1.238c.748.749 1.08 1.698 1.238 2.87q.074.562.107 1.23a.75.75 0 0 1 .019.46c.027.801.027 1.712.027 2.743V14a.75.75 0 0 1-1.5 0v-2c0-.854 0-1.597-.013-2.25H2.763c-.013.653-.013 1.396-.013 2.25v2c0 1.907.002 3.262.14 4.29c.135 1.005.389 1.585.812 2.008s1.003.677 2.009.812c1.028.138 2.382.14 4.289.14h4a.75.75 0 0 1 0 1.5H9.944c-1.838 0-3.294 0-4.433-.153c-1.172-.158-2.121-.49-2.87-1.238c-.748-.749-1.08-1.698-1.238-2.87c-.153-1.14-.153-2.595-.153-4.433v-2.112c0-1.031 0-1.942.027-2.744a.75.75 0 0 1 .02-.46q.032-.667.106-1.229c.158-1.172.49-2.121 1.238-2.87c.749-.748 1.698-1.08 2.87-1.238q.35-.046.739-.076V2.5A.75.75 0 0 1 7 1.75m-4.168 6.5h18.336q-.024-.284-.058-.54c-.135-1.005-.389-1.585-.812-2.008s-1.003-.677-2.009-.812c-1.027-.138-2.382-.14-4.289-.14h-4c-1.907 0-3.261.002-4.29.14c-1.005.135-1.585.389-2.008.812S3.025 6.705 2.89 7.71q-.034.255-.058.539M18 15.75a2.25 2.25 0 1 0 0 4.5a2.25 2.25 0 0 0 0-4.5M14.25 18a3.75 3.75 0 1 1 6.879 2.068l1.401 1.402a.75.75 0 1 1-1.06 1.06l-1.402-1.401A3.75 3.75 0 0 1 14.25 18" clip-rule="evenodd"/></svg>
        </span>
      </a>
      <button id="settingsToggle" aria-label="Settings">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M14.82 1H9.18l-.647 3.237a8.5 8.5 0 0 0-1.52.88l-3.13-1.059l-2.819 4.884l2.481 2.18a8.6 8.6 0 0 0 0 1.756l-2.481 2.18l2.82 4.884l3.129-1.058c.472.342.98.638 1.52.879L9.18 23h5.64l.647-3.237a8.5 8.5 0 0 0 1.52-.88l3.13 1.059l2.82-4.884l-2.482-2.18a8.6 8.6 0 0 0 0-1.756l2.481-2.18l-2.82-4.884l-3.128 1.058a8.5 8.5 0 0 0-1.52-.879zM12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" clip-rule="evenodd"/></svg>
        </span>
      </button>
      <button id="wordcloudBtn" aria-label="Word cloud">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5c0-2.64-2.05-4.78-4.65-4.96"/></svg>
        </span>
      </button>
    </div>
    <span id="status" class="status">idle</span>
    <span id="hoverAuthor" class="status"></span>
  </div>
  <div id="settingsPopout" class="settings-popout" hidden>
    <div class="settings-header">
      <span>Settings</span>
      <button id="settingsClose" aria-label="Close settings">X</button>
    </div>
    <div class="settings-row params">
      <label class="param url">llama url <input id="serverUrl" type="url" placeholder="http://localhost:8055/completion"></label>
      <label class="param">T <input id="temp" type="number" step="0.1" min="0" value="1"></label>
      <label class="param">top_k <input id="topk" type="number" step="1" min="0" value="0"></label>
      <label class="param">top_p <input id="topp" type="number" step="0.01" min="0" max="1" value="1"></label>
      <label class="param">min_p <input id="minp" type="number" step="0.01" min="0" max="1" value="0"></label>
      <label class="param">rep <input id="reppen" type="number" step="0.01" min="0" value="1"></label>
      <label class="param">max_tok <input id="maxtok" type="number" step="1" min="1" value="512"></label>
      <label class="param stop">stop <input id="stopTokens" type="text" placeholder="comma-separated"></label>
      <label class="param prefix">prefix <input id="prefix" type="text" placeholder="prepend on generate"></label>
      <label class="param postfix">postfix <input id="postfix" type="text" placeholder="append on stop"></label>
      <label class="param" title="hover generated tokens for J-lens per-layer readouts (requires llama-server --jlens)"><input id="jlensToggle" type="checkbox"> lens</label>
      <label class="param" title="tint tokens by the value lens: how much the next ~32 tokens depend on the model's state here (linear probe on layer 40; requires llama-server --jlens ... --value-probe readout_L40)"><input id="valueToggle" type="checkbox"> value</label>
      <label class="param" title="metric that tints the tokens in the value view: orange = high, blue = low (vs. fineweb percentiles; the exact metrics vs. this text). Exact metrics are computed by backprop over the whole text (several seconds)">color <select id="valueColor">
        <optgroup label="probe on layer 40">
          <option value="stakes">stakes (next 32)</option>
          <option value="now">next-token dependence</option>
          <option value="next8">forecast surprisal, next 8</option>
          <option value="next32">forecast surprisal, next 32</option>
        </optgroup>
        <optgroup label="output distribution">
          <option value="surprisal">surprisal</option>
          <option value="entropy">entropy</option>
          <option value="gap">surprise gap (surprisal - entropy)</option>
          <option value="entropy32">entropy, next 32</option>
          <option value="branches">branchiness, log(1 / sum p^2)</option>
          <option value="runner_up">runner-up ratio (p2 / p1)</option>
        </optgroup>
        <optgroup label="backprop over the text (slow)">
          <option value="stakes_all">stakes, all later tokens (exact)</option>
          <option value="now_x">next-token dependence (exact)</option>
          <option value="branch">branch impact (gradient, rough)</option>
        </optgroup>
      </select></label>
      <label class="param">show author on hover <input id="hoverLabel" type="checkbox"></label>
    </div>
    <div class="settings-header" style="margin-top: 12px;">
      <span>Rollout</span>
    </div>
    <div class="settings-row">
      <label class="param">count <input id="rolloutCount" type="number" step="1" min="1" value="5"></label>
      <label class="param">tokens <input id="rolloutTokens" type="number" step="1" min="1" value="512"></label>
    </div>
    <div class="settings-header" style="margin-top: 12px;">
      <span>Colors</span>
    </div>
    <div class="settings-row">
      <label class="param">user <input id="userColor" type="color" value="#e5e7eb"></label>
      <label class="param">model <input id="modelColor" type="color" value="#c4b5fd"></label>
      <label class="param">bg <input id="bgColor" type="color" value="#0b1220"></label>
      <label class="param">bar <input id="barColor" type="color" value="#0f172a"></label>
      <label class="param">icons <input id="btnColor" type="color" value="#e5e7eb"></label>
      <label class="param">buttons <input id="btnBgColor" type="color" value="#111827"></label>
      <button id="resetColors" type="button" style="font-size:11px;padding:4px 8px;">reset</button>
    </div>
  </div>
  <div id="wcModal">
    <div id="wcPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="wcTitle" class="status" style="font-size:13px;"></span>
        <div style="display:flex;gap:4px;align-items:center;">
          <button id="wcViewCloud" style="font-size:11px;padding:4px 8px;">cloud</button>
          <button id="wcViewChart" style="font-size:11px;padding:4px 8px;">bars</button>
          <a id="wcDiffLink" href="/diff" target="_blank" rel="noopener noreferrer" style="font-size:11px;padding:4px 8px;color:var(--btn-ink);text-decoration:none;border:1px solid var(--border);border-radius:6px;background:var(--btn-bg);">compare</a>

      const VALUE_METRICS = [

        { key: 'now', src: 'fast', ref: 'probe', label: 'next-token dependence (probe)', fmt: x => Math.exp(x).toFixed(3) },
        { key: 'next8', src: 'fast', ref: 'probe', label: 'forecast surprisal, next 8 (probe)', fmt: x => x.toFixed(2) + ' nats' },
        { key: 'next32', src: 'fast', ref: 'probe', label: 'forecast surprisal, next 32 (probe)', fmt: x => x.toFixed(2) + ' nats' },

      loadColors();
      const hoverAuthor = $('hoverAuthor');
      const padContainer = $('padContainer');
      const hoverCheckbox = $('hoverLabel');
      if (hoverCheckbox) {
        hoverCheckbox.checked = localStorage.getItem('loomui:hoverLabel') !== 'off';
        hoverCheckbox.addEventListener('change', () => {
          localStorage.setItem('loomui:hoverLabel', hoverCheckbox.checked ? 'on' : 'off');
          if (!hoverCheckbox.checked) hoverAuthor.textContent = '';
        });
      }
      if (padContainer && hoverAuthor) {
        padContainer.addEventListener('mousemove', e => {
          if (hoverCheckbox && !hoverCheckbox.checked) { hoverAuthor.textContent = ''; return; }
          const x = e.clientX, y = e.clientY;
          const hl = $('highlight');
          if (!hl) { hoverAuthor.textContent = ''; return; }
          const model = state.entry?.params?.model;
          for (const span of hl.querySelectorAll('.model-text')) {
            for (const rect of span.getClientRects()) {
              if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                hoverAuthor.textContent = model || state.modelName || 'model';
                hoverAuthor.style.color = 'var(--model-ink)';
                return;
              }
            }
          }
          for (const span of hl.querySelectorAll('.user-text')) {
            for (const rect of span.getClientRects()) {
              if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                hoverAuthor.textContent = 'user';
                hoverAuthor.style.color = 'var(--user-ink)';
                return;
              }
            }
          }
          hoverAuthor.textContent = '';
        });
        padContainer.addEventListener('mouseleave', () => { hoverAuthor.textContent = ''; });
      }
      // Word cloud & bar chart
      const wcBtn = $('wordcloudBtn');
      const wcModal = $('wcModal');
      const wcClose = $('wcClose');
      const wcCanvas = $('wcCanvas');
      const wcTitle = $('wcTitle');
      const wcChartWrap = $('wcChartWrap');
      const wcChartCanvas = $('wcChartCanvas');
      const wcViewCloud = $('wcViewCloud');
      const wcViewChart = $('wcViewChart');
      let wcLastFreq = [];
      let wcLastChildrenCount = 0;
      let wcChart = null;
      let wcCurrentView = 'cloud';
      const wcShowView = view => {
        wcCurrentView = view;
        wcCanvas.style.display = view === 'cloud' ? '' : 'none';
        wcChartWrap.style.display = view === 'chart' ? '' : 'none';
        if (view === 'chart' && wcLastFreq.length) wcRenderChart();
        const id = currentEntryId();
        if (id) setHash(id, { wc: view });
      };
      const wcRenderChart = () => {
        if (typeof Chart === 'undefined' || !wcLastFreq.length) return;
        const top = wcLastFreq.slice(0, 200);
        const total = wcLastChildrenCount || 1;
        const labels = top.map(([w]) => w);
        const data = top.map(([, c]) => c / total);
        const modelColor = getComputedStyle(document.documentElement).getPropertyValue('--model-ink').trim();
        const barH = top.length * 15;
        wcChartCanvas.style.height = barH + 'px';
        wcChartCanvas.height = barH;
        wcChartCanvas.width = 680;
        wcChartCanvas.style.width = '680px';
        if (wcChart) wcChart.destroy();
        wcChart = new Chart(wcChartCanvas, {
          type: 'bar',
          data: { labels, datasets: [{ data, backgroundColor: modelColor || '#c4b5fd', borderWidth: 0 }] },
          options: {
            indexAxis: 'y',
            responsive: false,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => (ctx.raw * 100).toFixed(1) + '% (' + top[ctx.dataIndex][1] + '/' + total + ')' } } },
            onClick: (evt, elements) => {
              if (!elements.length) return;
              const idx = elements[0].index;
              const word = top[idx][0];
              const parentId = state.entry?.id || '';
              window.open('/viewer?id=' + encodeURIComponent(parentId) + '&word=' + encodeURIComponent(word), '_blank');
            },
            scales: {
              x: { min: 0, ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--btn-ink').trim(), callback: v => (v * 100).toFixed(1) + '%' }, grid: { color: 'rgba(255,255,255,0.05)' } },
              y: { ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--btn-ink').trim(), autoSkip: false, font: { family: '"Iosevka","JetBrains Mono",monospace', size: 11 } }, grid: { display: false } }
            }
          }
        });
      };
      if (wcViewCloud) wcViewCloud.addEventListener('click', () => wcShowView('cloud'));
      if (wcViewChart) wcViewChart.addEventListener('click', () => wcShowView('chart'));
      const wcSaveCsv = $('wcSaveCsv');
      if (wcSaveCsv) wcSaveCsv.addEventListener('click', () => {
        if (!wcLastFreq.length) return;
        const total = wcLastChildrenCount || 1;
        const rows = ['word,count,pct_of_children'];
        for (const [w, c] of wcLastFreq) rows.push(`"${w.replace(/"/g,'""')}",${c},${(c / total * 100).toFixed(2)}`);
        const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'wordcloud.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      });
      if (wcBtn && wcModal) {
        const closeWc = () => { wcModal.classList.remove('show'); if (wcChart) { wcChart.destroy(); wcChart = null; } const id = currentEntryId(); if (id) setHash(id); };
        wcClose.addEventListener('click', closeWc);
        wcModal.addEventListener('click', e => { if (e.target === wcModal) closeWc(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && wcModal.classList.contains('show')) closeWc(); });
        wcBtn.addEventListener('click', async () => {
          const entry = state.entry;
          if (!entry?.id) return;
          const kids = normalizeChildren(entry.children);
          if (!kids.length) return;
          wcModal.classList.add('show');
          wcShowView('cloud');
          const prog = $('wcProgress'); const bar = $('wcBar'); const wcs = $('wcStatus');
          prog.style.display = ''; bar.style.width = '0%';
          wcTitle.textContent = 'Word Cloud';
          const diffLink = $('wcDiffLink');
          if (diffLink) diffLink.href = '/diff?a=' + encodeURIComponent(entry.id);
          wcs.textContent = `computing for ${kids.length} children…`;
          wcCanvas.innerHTML = '';
          bar.style.width = '30%';
          wcLastFreq = [];
          wcLastChildrenCount = 0;
          try {
            const res = await fetch('/history/wordcloud', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ parent_id: entry.id })
            });
            bar.style.width = '80%';
            if (res.ok) {
              const data = await res.json();
              wcLastFreq = data.words || [];
              wcLastChildrenCount = data.children_count || 0;
            }
          } catch (e) { console.error('wordcloud fetch failed', e); }
          if (!wcLastFreq.length) {
            wcs.textContent = 'not enough unique words across children';
            prog.style.display = 'none';
            return;
          }
          bar.style.width = '90%';
          wcs.textContent = `rendering ${wcLastFreq.length} words…`;
          await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
          const modelColor = getComputedStyle(document.documentElement).getPropertyValue('--model-ink').trim();
          window.LoomWordCloud.renderCloud(wcCanvas, wcLastFreq, modelColor);
          bar.style.width = '100%';
          wcs.textContent = `${wcLastChildrenCount} children, ${wcLastFreq.length} unique words`;
          setTimeout(() => { prog.style.display = 'none'; }, 400);
          const restoreView = getHashParam('wc');
          if (restoreView && restoreView !== 'cloud') wcShowView(restoreView);
        });
      }
      const loadInitial = async () => {
        try {
          const hashed = getHashId();
          if (hashed) await showId(hashed);
          else await fetchLatest();
          fitPad(false);
        } catch (err) {
          console.warn(err);
        } finally {
          updateHistoryStatus();
          const wcParam = getHashParam('wc');
          if (wcParam && wcBtn) wcBtn.click();
        }
      };
      setRunning(false);
      loadInitial();
      window.addEventListener('hashchange', () => {
        const id = getHashId();
        if (id) showId(id);
      });
      window.addEventListener('resize', fitPad);
      fitPad(false);
    })();
  </script>
</body>
</html>
