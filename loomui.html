<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Loom UI</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e5e7eb;
      --paper: #0b1220;
      --accent: #9ca3af;
      --muted: #94a3b8;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    html, body {
      touch-action: manipulation;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.4 "Iosevka", "JetBrains Mono", "SFMono-Regular", monospace;
      color: var(--ink);
      background: var(--paper);
      display: flex;
      flex-direction: column;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }
    .cluster { display: flex; gap: 8px; align-items: center; }
    .history { gap: 6px; }
    .history input {
      width: 72px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    textarea {
      width: 100%;
      padding: 14px;
      border: none;
      font: inherit;
      resize: none;
      background: transparent;
      color: var(--ink);
      outline: none;
      field-sizing: content;
      overflow: hidden;
    }
    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      background: #111827;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:active { transform: translateY(1px); }
    button.primary {
      background: #111827;
      color: var(--ink);
      box-shadow: 0 0 0 1px var(--accent) inset;
    }
    button:disabled { cursor: not-allowed; opacity: 0.5; box-shadow: none; transform: none; }
    #settingsToggle { font-size: 18px; padding: 10px 14px; }
    #sibPrev, #sibNext, #parentJump, #childJump { font-size: 16px; padding: 10px 14px; }
    .button-link {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      background: #111827;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .button-link.calendar {
      padding: 10px 14px;
      font-size: 18px;
      line-height: 1.4;
      min-height: 46px;
      height: 46px;
    }
    .icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      line-height: 0;
    }
    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .button-link:active { transform: translateY(1px); }
    .status { color: var(--muted); font-size: 12px; }
    .param { color: var(--muted); display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .param input {
      width: 70px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    .param select {
      min-width: 160px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 4px;
      padding: 6px 8px;
      font: inherit;
    }
    .param.stop input { width: 200px; }
    .param.prefix input { width: 180px; }
    .param.postfix input { width: 180px; }
    .param.url input { width: 260px; }
    .settings-popout {
      position: absolute;
      top: 52px;
      right: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      z-index: 20;
      min-width: 320px;
      max-width: min(520px, 90vw);
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-weight: 600;
    }
    .settings-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    @media (max-width: 100%) {
      body { font-size: 42px; }
      textarea, input, button, .status, .param { font-size: inherit; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="cluster">
      <button id="generate" class="primary" aria-label="Generate">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M8 17.175V6.825q0-.425.3-.713t.7-.287q.125 0 .263.037t.262.113l8.15 5.175q.225.15.338.375t.112.475t-.112.475t-.338.375l-8.15 5.175q-.125.075-.262.113T9 18.175q-.4 0-.7-.288t-.3-.712"/></svg>
        </span>
      </button>
    </div>

    <div class="cluster">
      <button id="sibPrev" aria-label="Previous sibling">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="m7.85 13l2.85 2.85q.3.3.288.7t-.288.7q-.3.3-.712.313t-.713-.288L4.7 12.7q-.3-.3-.3-.7t.3-.7l4.575-4.575q.3-.3.713-.287t.712.312q.275.3.288.7t-.288.7L7.85 11H19q.425 0 .713.288T20 12t-.288.713T19 13z"/></svg>
        </span>
      </button>
      <button id="parentJump" aria-label="Parent">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="m11 7.825l-4.9 4.9q-.3.3-.7.288t-.7-.313q-.275-.3-.288-.7t.288-.7l6.6-6.6q.15-.15.325-.212T12 4.425t.375.063t.325.212l6.6 6.6q.275.275.275.688t-.275.712q-.3.3-.712.3t-.713-.3L13 7.825V19q0 .425-.288.713T12 20t-.712-.288T11 19z"/></svg>
        </span>
      </button>
      <button id="childJump" aria-label="First child">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M11 16.175V5q0-.425.288-.712T12 4t.713.288T13 5v11.175l4.9-4.9q.3-.3.7-.288t.7.313q.275.3.287.7t-.287.7l-6.6 6.6q-.15.15-.325.213t-.375.062t-.375-.062t-.325-.213l-6.6-6.6q-.275-.275-.275-.687T4.7 11.3q.3-.3.713-.3t.712.3z"/></svg>
        </span>
      </button>
      <button id="sibNext" aria-label="Next sibling">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M16.15 13H5q-.425 0-.712-.288T4 12t.288-.712T5 11h11.15L13.3 8.15q-.3-.3-.288-.7t.288-.7q.3-.3.713-.312t.712.287L19.3 11.3q.15.15.213.325t.062.375t-.062.375t-.213.325l-4.575 4.575q-.3.3-.712.288t-.713-.313q-.275-.3-.288-.7t.288-.7z"/></svg>
        </span>
      </button>
      <span id="siblingCount" class="status"></span>
    </div>
    <div class="cluster history">
      <button id="prev" style="display:none;" disabled aria-label="Previous entry">Prev</button>
      <input id="histIndex" style="display:none;" type="number" min="0" step="1" aria-label="History index">
      <span id="historyStatus" style="display:none;" class="status">0/0</span>
      <button id="next" style="display:none;" disabled aria-label="Next entry">Next</button>
    </div>
    <div class="cluster">
      <label class="param">
        <select id="childSelect" aria-label="Children of current entry" style="display:none;">
          <option value="">no children</option>
        </select>
      </label>
    </div>
    <div class="cluster">
      <a id="calendarLink" class="button-link calendar" href="/calendar" target="_blank" rel="noopener noreferrer" aria-label="Calendar" title="Open calendar">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M7 1.75a.75.75 0 0 1 .75.75v.763c.662-.013 1.391-.013 2.194-.013h4.112c.803 0 1.532 0 2.194.013V2.5a.75.75 0 0 1 1.5 0v.827q.39.03.739.076c1.172.158 2.121.49 2.87 1.238c.748.749 1.08 1.698 1.238 2.87q.074.562.107 1.23a.75.75 0 0 1 .019.46c.027.801.027 1.712.027 2.743V14a.75.75 0 0 1-1.5 0v-2c0-.854 0-1.597-.013-2.25H2.763c-.013.653-.013 1.396-.013 2.25v2c0 1.907.002 3.262.14 4.29c.135 1.005.389 1.585.812 2.008s1.003.677 2.009.812c1.028.138 2.382.14 4.289.14h4a.75.75 0 0 1 0 1.5H9.944c-1.838 0-3.294 0-4.433-.153c-1.172-.158-2.121-.49-2.87-1.238c-.748-.749-1.08-1.698-1.238-2.87c-.153-1.14-.153-2.595-.153-4.433v-2.112c0-1.031 0-1.942.027-2.744a.75.75 0 0 1 .02-.46q.032-.667.106-1.229c.158-1.172.49-2.121 1.238-2.87c.749-.748 1.698-1.08 2.87-1.238q.35-.046.739-.076V2.5A.75.75 0 0 1 7 1.75m-4.168 6.5h18.336q-.024-.284-.058-.54c-.135-1.005-.389-1.585-.812-2.008s-1.003-.677-2.009-.812c-1.027-.138-2.382-.14-4.289-.14h-4c-1.907 0-3.261.002-4.29.14c-1.005.135-1.585.389-2.008.812S3.025 6.705 2.89 7.71q-.034.255-.058.539M18 15.75a2.25 2.25 0 1 0 0 4.5a2.25 2.25 0 0 0 0-4.5M14.25 18a3.75 3.75 0 1 1 6.879 2.068l1.401 1.402a.75.75 0 1 1-1.06 1.06l-1.402-1.401A3.75 3.75 0 0 1 14.25 18" clip-rule="evenodd"/></svg>
        </span>
      </a>
      <button id="settingsToggle" aria-label="Settings">
        <span class="icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M14.82 1H9.18l-.647 3.237a8.5 8.5 0 0 0-1.52.88l-3.13-1.059l-2.819 4.884l2.481 2.18a8.6 8.6 0 0 0 0 1.756l-2.481 2.18l2.82 4.884l3.129-1.058c.472.342.98.638 1.52.879L9.18 23h5.64l.647-3.237a8.5 8.5 0 0 0 1.52-.88l3.13 1.059l2.82-4.884l-2.482-2.18a8.6 8.6 0 0 0 0-1.756l2.481-2.18l-2.82-4.884l-3.128 1.058a8.5 8.5 0 0 0-1.52-.879zM12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12Z" clip-rule="evenodd"/></svg>
        </span>
      </button>
    </div>
    <span id="status" class="status">idle</span>
  </div>
  <div id="settingsPopout" class="settings-popout" hidden>
    <div class="settings-header">
      <span>Settings</span>
      <button id="settingsClose" aria-label="Close settings">X</button>
    </div>
    <div class="settings-row params">
      <label class="param url">llama url <input id="serverUrl" type="url" placeholder="http://localhost:8055/completion"></label>
      <label class="param">T <input id="temp" type="number" step="0.1" min="0" value="1"></label>
      <label class="param">top_k <input id="topk" type="number" step="1" min="0" value="0"></label>
      <label class="param">top_p <input id="topp" type="number" step="0.01" min="0" max="1" value="1"></label>
      <label class="param">min_p <input id="minp" type="number" step="0.01" min="0" max="1" value="0"></label>
      <label class="param">rep <input id="reppen" type="number" step="0.01" min="0" value="1"></label>
      <label class="param">max_tok <input id="maxtok" type="number" step="1" min="1" value="512"></label>
      <label class="param stop">stop <input id="stopTokens" type="text" placeholder="comma-separated"></label>
      <label class="param prefix">prefix <input id="prefix" type="text" placeholder="prepend on generate"></label>
      <label class="param postfix">postfix <input id="postfix" type="text" placeholder="append on stop"></label>
    </div>
  </div>
  <textarea id="pad" spellcheck="false" placeholder="Type or paste context here, then press Generate."></textarea>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const state = { controller: null, base: '', gen: '', entry: null, cache: new Map(), total: 0, ignoreLog: false, lastPreGenIdx: null, runId: null, runLoggedEnd: false, postfixApplied: false, serverUrl: '' };
      const DEFAULT_COMPLETION_URL = 'http://localhost:8055/completion';
      const SERVER_URL_STORAGE_KEY = 'loomui:serverUrl';
      const newId = () => crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(16).slice(2) + Date.now().toString(16);
      const getHashId = () => (location.hash || '').replace(/^#/, '') || null;
      const setHash = id => { if (id) location.hash = id; };
      const readStoredServerUrl = () => {
        try {
          const saved = localStorage.getItem(SERVER_URL_STORAGE_KEY);
          if (typeof saved === 'string' && saved.trim()) return saved.trim();
        } catch (err) {
          console.warn('reading server url failed', err);
        }
        return DEFAULT_COMPLETION_URL;
      };
      const setServerUrl = raw => {
        const normalized = (raw || '').trim() || DEFAULT_COMPLETION_URL;
        state.serverUrl = normalized;
        const input = $('serverUrl');
        if (input && input.value !== normalized) input.value = normalized;
        try {
          localStorage.setItem(SERVER_URL_STORAGE_KEY, normalized);
        } catch (err) {
          console.warn('saving server url failed', err);
        }
        return normalized;
      };
      const getServerUrl = () => {
        const normalized = (state.serverUrl || '').trim();
        return normalized || DEFAULT_COMPLETION_URL;
      };
      const histInput = $('histIndex');
      const undoButton = $('undoGen');
      const generateButton = $('generate');
      const childSelect = $('childSelect');
      const parentJump = $('parentJump');
      const childJump = $('childJump');
      const sibPrev = $('sibPrev');
      const sibNext = $('sibNext');
      const settingsToggle = $('settingsToggle');
      const settingsClose = $('settingsClose');
      const settingsPopout = $('settingsPopout');
      const serverUrlInput = $('serverUrl');
      const generateIconMarkup = '<span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M8 17.175V6.825q0-.425.3-.713t.7-.287q.125 0 .263.037t.262.113l8.15 5.175q.225.15.338.375t.112.475t-.112.475t-.338.375l-8.15 5.175q-.125.075-.262.113T9 18.175q-.4 0-.7-.288t-.3-.712"/></svg></span>';
      const pauseIconMarkup = '<span class="icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M6 16V8q0-.825.588-1.412T8 6h8q.825 0 1.413.588T18 8v8q0 .825-.587 1.413T16 18H8q-.825 0-1.412-.587T6 16"/></svg></span>';
      const setGenerateIdleLabel = () => {
        if (!generateButton) return;
        generateButton.innerHTML = generateIconMarkup;
        generateButton.setAttribute('aria-label', 'Generate');
      };
      const setGenerateRunningLabel = () => {
        if (!generateButton) return;
        generateButton.innerHTML = pauseIconMarkup;
        generateButton.setAttribute('aria-label', 'Stop');
      };
      const preview = (text, len = 48) => {
        if (!text) return '(empty)';
        const cleaned = String(text).replace(/\s+/g, ' ').trim();
        return cleaned.length > len ? `${cleaned.slice(0, len)}…` : cleaned;
      };
      const withLogPaused = fn => { state.ignoreLog = true; try { fn(); } finally { state.ignoreLog = false; } };
      const currentIndex = () => Number.isFinite(state.entry?.index) ? state.entry.index : -1;
      const currentEntryId = () => state.entry?.id ?? null;
      const selectedParentId = () => currentEntryId() || getHashId() || null;
      const canPrev = () => currentIndex() > 0;
      const canNext = () => {
        const idx = currentIndex();
        if (idx < 0) return false;
        if (state.total) return idx < state.total - 1;
        return true;
      };
      const setUndoEnabled = () => { if (undoButton) undoButton.disabled = state.lastPreGenIdx == null || !!state.controller; };
      const isNearBottom = (threshold = 48) => {
        const doc = document.documentElement;
        const remaining = doc.scrollHeight - (window.scrollY + window.innerHeight);
        if (remaining <= 0) return true; // already at the bottom (or no overflow)
        return remaining <= threshold && window.scrollY > 0;
      };
      const getStopRaw = () => $('stopTokens')?.value ?? '';
      const parseStopTokens = val => (val || '').split(',').map(s => s.trim()).filter(Boolean).map(s => s.replace(/\\n/g, '\n'));
      const getPrefixRaw = () => $('prefix')?.value ?? '';
      const getPrefix = () => getPrefixRaw().replace(/\\n/g, '\n');
      const getPostfixRaw = () => $('postfix')?.value ?? '';
      const getPostfix = () => getPostfixRaw().replace(/\\n/g, '\n');
      const fitPad = stickToBottomInput => {
        const pad = $('pad');
        if (!pad) return;
        const bar = document.querySelector('.bar');
        const available = Math.max(0, window.innerHeight - (bar?.offsetHeight || 0));
        const baseMinHeight = 120;
        const minHeight = available ? Math.min(baseMinHeight, available) : baseMinHeight;
        const shouldStick = typeof stickToBottomInput === 'boolean' ? stickToBottomInput : isNearBottom();
        const prevScroll = window.scrollY;
        pad.style.height = 'auto';
        const contentHeight = Math.max(minHeight, pad.scrollHeight);
        pad.style.height = contentHeight + 'px';
        if (shouldStick) window.scrollTo({ top: document.documentElement.scrollHeight });
        else window.scrollTo({ top: prevScroll });
      };
      const entryById = id => (id ? state.cache.get(id) : null);
      const normalizeChildren = kids => {
        if (!Array.isArray(kids) || !kids.length) return [];
        let invalid = false;
        const byId = new Map();
        kids.forEach(child => {
          if (invalid) return;
          if (!child || typeof child !== 'object') { invalid = true; return; }
          const id = typeof child.id === 'string' ? child.id : null;
          const msVal = Number(child.ms);
          if (!id || !Number.isFinite(msVal)) { invalid = true; return; }
          const existing = byId.get(id);
          if (!existing || msVal > existing.ms) byId.set(id, { id, ms: msVal });
        });
        if (invalid) return [];
        return [...byId.values()].sort((a, b) => {
          if (a.ms !== b.ms) return a.ms - b.ms;
          return b.id.localeCompare(a.id);
        });
      };
      const upsertChild = (kids, child) => {
        const normalized = normalizeChildren(kids);
        if (!child || typeof child.id !== 'string') return normalized;
        const msVal = Number(child.ms);
        if (!Number.isFinite(msVal)) return normalized;
        const filtered = normalized.filter(c => c.id !== child.id);
        filtered.push({ id: child.id, ms: msVal });
        return normalizeChildren(filtered);
      };
      const storeEntry = entry => {
        const incomingId = entry.id || newId();
        const existing = state.cache.get(incomingId) || {};
        const normalizedChildren = normalizeChildren(entry.children ?? existing.children);
        const normalized = {
          ...existing,
          ...entry,
          id: incomingId,
          params: entry.params || existing.params || {},
          children: normalizedChildren,
          lastChildVisited: typeof (entry.lastChildVisited ?? existing.lastChildVisited) === 'string'
            ? (entry.lastChildVisited ?? existing.lastChildVisited)
            : null
        };
        state.cache.set(incomingId, normalized);
        if (Number.isFinite(normalized.index)) state.total = Math.max(state.total, normalized.index + 1);
        if (normalized.parent) {
          const parent = state.cache.get(normalized.parent);
          if (parent) {
            parent.children = upsertChild(parent.children, { id: normalized.id, ms: normalized.ms ?? Date.now() });
            state.cache.set(parent.id, parent);
          }
        }
        return normalized;
      };
      const recordLastVisited = (parentId, childId) => {
        if (!parentId || !childId) return;
        const childEntry = entryById(childId);
        const childMs = Number(childEntry?.ms);
        const ms = Number.isFinite(childMs) ? childMs : Date.now();
        fetch('/history/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'last_child_visited', parent: parentId, child: childId, ms })
        }).catch(err => console.warn('last_child_visited log failed', err));
        const parent = entryById(parentId);
        if (parent) {
          parent.lastChildVisited = childId;
          parent.children = upsertChild(parent.children, { id: childId, ms });
          state.cache.set(parentId, parent);
        }
      };
      const setSettingsVisible = on => {
        if (!settingsPopout) return;
        settingsPopout.hidden = !on;
      };
      const ensureParentData = entry => {
        if (!entry?.parent) return;
        const parent = entryById(entry.parent);
        if (parent?.children?.length) return;
        fetchEntry({ id: entry.parent }).then(() => updateHistoryStatus()).catch(() => {});
      };
      const setCurrent = entry => {
        if (!entry) return;
        const normalized = storeEntry(entry);
        state.entry = normalized;
        state.lastPreGenIdx = normalized.pre_gen_index ?? state.lastPreGenIdx;
        withLogPaused(() => {
          $('pad').value = normalized.text ?? '';
          setParams(normalized.params);
          fitPad();
        });
        setHash(normalized.id);
        updateHistoryStatus();
        ensureParentData(normalized);
      };
      const updateHistoryStatus = () => {
        const idx = currentIndex();
        const total = state.total || (idx >= 0 ? idx + 1 : 0);
        $('historyStatus').textContent = `${idx >= 0 ? idx + 1 : 0}/${total}`;
        $('prev').disabled = !!state.controller || !canPrev();
        $('next').disabled = !!state.controller || !canNext();
        setUndoEnabled();
        if (histInput) {
          histInput.value = idx >= 0 ? idx : '';
          histInput.placeholder = total ? 'index' : '';
        }
        updateChildSelector();
        updateSiblingButtons();
        updateSiblingCount();
        updateParentButton();
        updateChildButton();
      };
      var modified = false;
      const flagChange = () => {
        modified = true;
      };
      const logChange = text => {
        if (!modified) return;
        if (state.ignoreLog) return;
        modified = false;
        const content = text ?? $('pad')?.value;
        if (content === undefined) return;
        const id = newId();
        const ts = Date.now();
        fetch('/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: content,
            ts: ts / 1000,
            ms: ts,
            id,
            params: getParams(),
            pre_gen_index: state.lastPreGenIdx,
            parent: selectedParentId()
          })
        })
          .then(res => res.ok ? res.json() : null)
          .then(data => { if (data?.entry) setCurrent(data.entry); })
          .catch(err => console.error('history post failed', err));
      };
      const getParams = () => {
        const num = (id, fallback, parser = parseFloat) => {
          const n = parser($(id).value);
          return Number.isFinite(n) ? n : fallback;
        };
        const stopRaw = getStopRaw();
        const stopTokens = parseStopTokens(stopRaw);
        const prefixRaw = getPrefixRaw();
        const prefix = getPrefix();
        const postfixRaw = getPostfixRaw();
        const postfix = getPostfix();
        return {
          temperature: num('temp', 1, parseFloat),
          top_k: num('topk', 0, parseInt),
          top_p: num('topp', 1, parseFloat),
          min_p: num('minp', 0, parseFloat),
          repetition_penalty: num('reppen', 1, parseFloat),
          n_predict: num('maxtok', 512, parseInt),
          server_url: getServerUrl(),
          stop: stopTokens.length ? stopTokens : undefined,
          stop_raw: stopRaw || undefined,
          prefix: prefix || undefined,
          prefix_raw: prefixRaw || undefined,
          postfix: postfix || undefined,
          postfix_raw: postfixRaw || undefined
        };
      };
      const setParams = params => {
        if (!params) return;
        const set = (id, val) => {
          if (val === undefined || val === null) return;
          const el = $(id);
          if (el) el.value = val;
        };
        set('temp', params.temperature);
        set('topk', params.top_k);
        set('topp', params.top_p);
        set('minp', params.min_p);
        set('reppen', params.repetition_penalty);
        set('maxtok', params.n_predict ?? params.max_tokens ?? params.max_new_tokens);
        const serverUrlVal = params.server_url ?? params.base_url ?? params.url;
        if (serverUrlVal !== undefined && serverUrlVal !== null && serverUrlVal !== '') {
          setServerUrl(serverUrlVal);
        }
        const stop = params.stop || params.stop_tokens || [];
        const stopField = $('stopTokens');
        if (stopField) {
          const stopRaw = params.stop_raw ?? params.stop_tokens_raw ?? (
            Array.isArray(stop)
              ? stop.map(s => typeof s === 'string' ? s.replace(/\n/g, '\\n') : s).join(', ')
              : (typeof stop === 'string' ? stop.replace(/\n/g, '\\n') : stop)
          );
          stopField.value = stopRaw || '';
        }
        const prefixField = $('prefix');
        if (prefixField) {
          const raw = params.prefix_raw ?? params.prefix ?? params.input_prefix ?? '';
          prefixField.value = typeof raw === 'string' ? raw.replace(/\n/g, '\\n') : raw;
        }
        const postfixField = $('postfix');
        if (postfixField) {
          const raw = params.postfix_raw ?? params.postfix ?? params.output_postfix ?? '';
          postfixField.value = typeof raw === 'string' ? raw.replace(/\n/g, '\\n') : raw;
        }
      };
      const childOptionLabel = id => {
        const entry = entryById(id);
        if (!entry) return id;
        const idxLabel = Number.isFinite(entry.index) ? `#${entry.index} ` : '';
        return `${idxLabel}${preview(entry.text, 40)}`;
      };
      function updateParentButton() {
        if (!parentJump) return;
        parentJump.disabled = !state.entry?.parent;
      }
      function updateChildButton() {
        if (!childJump) return;
        const kids = normalizeChildren(state.entry?.children);
        childJump.disabled = !kids.length;
      }
      function updateSiblingButtons() {
        if (!sibPrev || !sibNext) return;
        const entry = state.entry;
        const parent = entry?.parent ? entryById(entry.parent) : null;
        const kids = normalizeChildren(parent?.children);
        const ids = kids.map(k => k.id);
        const pos = ids.indexOf(entry?.id);
        sibPrev.disabled = pos <= 0;
        sibNext.disabled = pos === -1 || pos >= ids.length - 1;
      }
      function updateSiblingCount() {
        const label = $('siblingCount');
        if (!label) return;
        const entry = state.entry;
        if (!entry?.parent) {
          label.textContent = '0/0';
          return;
        }
        const parent = entryById(entry.parent);
        const kids = normalizeChildren(parent?.children);
        const ids = kids.map(k => k.id);
        const pos = ids.indexOf(entry.id);
        const total = ids.length;
        const current = pos >= 0 ? pos + 1 : 0;
        label.textContent = `${current}/${total}`;
      }
      async function jumpSibling(delta) {
        const entry = state.entry;
        if (!entry?.parent) return;
        let parent = entryById(entry.parent);
        if (!parent) parent = await fetchEntry({ id: entry.parent });
        const kids = normalizeChildren(parent?.children);
        const pos = kids.findIndex(k => k.id === entry.id);
        const target = kids[pos + delta]?.id;
        if (target) await showId(target);
      }
      async function jumpFirstChild() {
        const entry = state.entry;
        const kids = normalizeChildren(entry?.children);
        if (!kids.length) return;
        const preferredId = entry.lastChildVisited;
        const target = typeof preferredId === 'string' && kids.some(k => k.id === preferredId)
          ? preferredId
          : kids[0]?.id;
        if (target) await showId(target);
      }
      async function jumpParent() {
        const entry = state.entry;
        if (!entry?.parent) return;
        recordLastVisited(entry.parent, entry.id);
        await showId(entry.parent);
      }
      function updateChildSelector() {
        if (!childSelect) return;
        childSelect.innerHTML = '';
        const entry = state.entry;
        if (!entry) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'no entry';
          childSelect.appendChild(opt);
          childSelect.disabled = true;
          return;
        }
        const children = normalizeChildren(entry.children);
        if (!children.length) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'no children';
          childSelect.appendChild(opt);
          childSelect.disabled = true;
        } else {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'choose child…';
          childSelect.appendChild(opt);
          children.forEach(child => {
            const o = document.createElement('option');
            o.value = String(child.id);
            o.textContent = childOptionLabel(child.id);
            childSelect.appendChild(o);
          });
          childSelect.disabled = false;
        }
        childSelect.value = '';
      }
      const fetchEntry = async query => {
        const qs = new URLSearchParams();
        if (query.id) qs.set('id', query.id);
        if (Number.isFinite(query.index)) qs.set('index', query.index);
        if (query.latest) qs.set('latest', '1');
        const res = await fetch(`/history?${qs.toString()}`);
        if (!res.ok) return null;
        const data = await res.json();
        if (Number.isFinite(data.total)) state.total = data.total;
        if (!data.entry) return null;
        return storeEntry({ ...data.entry, params: data.entry.params || {} });
      };
      const showIndex = async idx => {
        if (!Number.isFinite(idx) || idx < 0) return;
        const entry = await fetchEntry({ index: idx });
        if (entry) setCurrent(entry);
      };
      const showId = async id => {
        if (!id) return;
        const cached = entryById(id);
        if (cached?.text) return setCurrent(cached);
        const entry = await fetchEntry({ id });
        if (entry) setCurrent(entry);
      };
      const fetchLatest = async () => {
        const entry = await fetchEntry({ latest: true });
        if (entry) setCurrent(entry);
      };
      const setRunning = on => {
        if (generateButton) {
          if (on) setGenerateRunningLabel();
          else setGenerateIdleLabel();
          generateButton.classList.toggle('primary', !on);
        }
        $('pad').readOnly = on;
        $('status').textContent = on ? 'generating…' : 'idle';
        updateHistoryStatus();
        setUndoEnabled();
      };
      const applyPostfix = () => {
        if (state.postfixApplied) return;
        const postfix = getPostfix();
        const pad = $('pad');
        if (!pad || !postfix) {
          state.postfixApplied = true;
          return;
        }
        const stickToBottom = isNearBottom();
        const wasFocused = document.activeElement === pad;
        const atEnd = wasFocused && pad.selectionStart === pad.value.length && pad.selectionEnd === pad.value.length;
        state.gen += postfix;
        pad.value = state.base + state.gen;
        if (wasFocused && atEnd) {
          const pos = pad.value.length;
          pad.selectionStart = pos;
          pad.selectionEnd = pos;
        }
        state.postfixApplied = true;
        fitPad(stickToBottom);
      };
      const logGenerationEnd = () => {
        if (!state.runId || state.runLoggedEnd) return;
        applyPostfix();
        state.runLoggedEnd = true;
        logChange();
      };
      const stop = () => {
        const wasGenerating = !!state.controller;
        if (state.controller) state.controller.abort();
        state.controller = null;
        if (wasGenerating) logGenerationEnd();
        setRunning(false);
        $('status').textContent = 'stopped';
      };
      const mergeContent = text => {
        if (text.startsWith(state.gen)) state.gen = text;
        else state.gen += text;
        modified = true;
        const pad = $('pad');
        const stickToBottom = isNearBottom();
        const wasFocused = document.activeElement === pad;
        const atEnd = wasFocused && pad.selectionStart === pad.value.length && pad.selectionEnd === pad.value.length;
        pad.value = state.base + state.gen;
        if (wasFocused && atEnd) {
          const pos = pad.value.length;
          pad.selectionStart = pos;
          pad.selectionEnd = pos;
        }
        fitPad(stickToBottom);
      };
      const handleEvent = chunk => {
        if (chunk === '[DONE]') return stop();
        try {
          const msg = JSON.parse(chunk);
          const piece = msg.content ?? msg.token ?? msg.text ?? '';
          if (piece) mergeContent(piece);
          if (msg.stop) stop();
        } catch (err) {
          console.error('bad chunk', chunk, err);
        }
      };
      const pumpStream = async res => {
        const reader = res.body?.getReader();
        if (!reader) throw new Error('No stream from server');
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let split;
          while ((split = buffer.indexOf('\n\n')) >= 0) {
            const packet = buffer.slice(0, split);
            buffer = buffer.slice(split + 2);
            packet.split(/\n/).forEach(line => {
              const data = line.replace(/^data:\s*/, '').trim();
              if (data) handleEvent(data);
            });
          }
        }
        if (buffer.trim()) {
          buffer.split(/\n/).forEach(line => {
            const data = line.replace(/^data:\s*/, '').trim();
            if (data) handleEvent(data);
          });
        }
      };
      const generate = async () => {
        const beforeIdx = currentIndex();
        logChange();
        stop();
        if (serverUrlInput) setServerUrl(serverUrlInput.value);
        state.lastPreGenIdx = beforeIdx >= 0 ? beforeIdx : null;
        setUndoEnabled();
        state.base = $('pad').value;
        modified = true;
        const prefix = getPrefix();
        if (prefix) {
          state.base += prefix;
          withLogPaused(() => {
            const pad = $('pad');
            if (pad) {
              pad.value = state.base;
              const pos = pad.value.length;
              pad.selectionStart = pos;
              pad.selectionEnd = pos;
              fitPad(true);
            }
          });
        }
        state.gen = '';
        const prompt = state.base;
        state.runId = newId();
        state.runLoggedEnd = false;
        state.postfixApplied = false;
        //logChange(state.base);
        setRunning(true);
        $('status').textContent = 'generating…';
        state.controller = new AbortController();
        try {
          const endpoint = getServerUrl();
          const params = getParams();
          const { server_url, ...llamaParams } = params;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, stream: true, ...llamaParams }),
            signal: state.controller.signal
          });
          if (!res.ok) throw new Error(`Server ${res.status}`);
          await pumpStream(res);
          $('status').textContent = 'done';
          logGenerationEnd();
        } catch (err) {
          logGenerationEnd();
          if (err.name === 'AbortError') $('status').textContent = 'stopped';
          else $('status').textContent = `error: ${err.message}`;
        } finally {
          setRunning(false);
          state.controller = null;
          state.runId = null;
          state.runLoggedEnd = false;
        }
      };
      $('generate').addEventListener('mousedown', (e) => {if (!state.controller) { e.preventDefault(); generate(); } });
      $('generate').addEventListener('touchdown', (e) => {if (!state.controller) { e.preventDefault(); generate(); } });
      $('prev').addEventListener('click', () => showIndex(currentIndex() - 1));
      $('next').addEventListener('click', () => showIndex(currentIndex() + 1));
      if (parentJump) parentJump.addEventListener('click', () => jumpParent());
      if (childJump) childJump.addEventListener('click', () => jumpFirstChild());
      if (sibPrev) sibPrev.addEventListener('click', () => jumpSibling(-1));
      if (sibNext) sibNext.addEventListener('click', () => jumpSibling(1));
      if (settingsToggle) settingsToggle.addEventListener('click', () => {
        if (!settingsPopout) return;
        setSettingsVisible(settingsPopout.hidden);
      });
      if (settingsClose) settingsClose.addEventListener('click', () => setSettingsVisible(false));
      document.addEventListener('click', e => {
        if (!settingsPopout || settingsPopout.hidden) return;
        if (settingsPopout.contains(e.target) || settingsToggle?.contains(e.target)) return;
        setSettingsVisible(false);
      });
      setServerUrl(readStoredServerUrl());
      const syncServerUrl = () => { if (serverUrlInput) setServerUrl(serverUrlInput.value); };
      if (serverUrlInput) {
        serverUrlInput.addEventListener('change', syncServerUrl);
        serverUrlInput.addEventListener('blur', syncServerUrl);
      }
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && settingsPopout && !settingsPopout.hidden) {
          setSettingsVisible(false);
        }
      });
      document.addEventListener('keydown', e => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key === 'Enter') {
          if (state.controller) stop();
          else generate();
        } else if (mod && e.key === 'ArrowUp') {
          e.preventDefault();
          if (parentJump && !parentJump.disabled) parentJump.click();
        } else if (mod && e.key === 'ArrowDown') {
          e.preventDefault();
          if (childJump && !childJump.disabled) childJump.click();
        } else if (mod && e.key === 'ArrowLeft') {
          e.preventDefault();
          if (sibPrev && !sibPrev.disabled) sibPrev.click();
        } else if (mod && e.key === 'ArrowRight') {
          e.preventDefault();
          if (sibNext && !sibNext.disabled) sibNext.click();
        } else if (mod && (e.key === 'z' || e.key === 'Z')) {
          const pad = $('pad');
          const focusedPad = document.activeElement === pad;
          const padEditable = pad && !pad.readOnly;
          if (focusedPad && padEditable) return;
          e.preventDefault();
          undoGeneration();
        }
      });
      $('pad').addEventListener('input', () => { fitPad(); flagChange(); });
      ['temp', 'topk', 'topp', 'minp', 'reppen', 'maxtok', 'stopTokens', 'prefix', 'postfix'].forEach(id => {
        const el = $(id);
        if (el) el.addEventListener('input', () => flagChange());
      });
      const undoGeneration = () => {
        if (state.lastPreGenIdx == null) return;
        stop();
        showIndex(state.lastPreGenIdx);
        state.base = $('pad').value;
        state.gen = '';
        state.lastPreGenIdx = null;
        setUndoEnabled();
      };
      if (undoButton) undoButton.addEventListener('click', undoGeneration);
      const jumpToIndexInput = () => {
        if (!histInput || !histInput.value) return;
        const num = parseInt(histInput.value, 10);
        showIndex(num);
      };
      if (histInput) {
        histInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            jumpToIndexInput();
          }
        });
        histInput.addEventListener('blur', jumpToIndexInput);
      }
      if (childSelect) {
        childSelect.addEventListener('change', e => {
          const raw = e.target.value;
          if (!raw) return;
          showId(raw);
          childSelect.value = '';
        });
      }
      const enableTouchStop = () => {
        const onTouchStop = e => {
          if (!state.controller) return true;
          // Only react to genuine touch/pointer taps.
          const isTouchEvent = e.type === 'touchstart' || e.type == "pointerdown";
          if (isTouchEvent) {
            stop();
          }
          e.preventDefault();
          return false;
        };
        document.addEventListener('touchstart', onTouchStop);
        document.addEventListener('pointerdown', onTouchStop);
      };
      enableTouchStop();
      const loadInitial = async () => {
        try {
          const hashed = getHashId();
          if (hashed) await showId(hashed);
          else await fetchLatest();
          fitPad(false);
        } catch (err) {
          console.warn(err);
        } finally {
          updateHistoryStatus();
        }
      };
      setRunning(false);
      loadInitial();
      window.addEventListener('hashchange', () => {
        const id = getHashId();
        if (id) showId(id);
      });
      window.addEventListener('resize', fitPad);
      fitPad(false);
    })();
  </script>
</body>
</html>
